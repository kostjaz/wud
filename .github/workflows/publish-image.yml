name: Publish WUD image

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-wud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push linux/amd64
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.WUD_REGISTRY_URL }}
      IMAGE_NAME: ${{ vars.WUD_IMAGE_NAME }}
      REGISTRY_USERNAME: ${{ vars.WUD_REGISTRY_USERNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: image
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${REGISTRY}" ]]; then
            echo "Repository variable WUD_REGISTRY_URL is required" >&2
            exit 1
          fi

          if [[ -z "${IMAGE_NAME}" ]]; then
            echo "Repository variable WUD_IMAGE_NAME is required" >&2
            exit 1
          fi

          if [[ -z "${REGISTRY_USERNAME}" ]]; then
            echo "Repository variable WUD_REGISTRY_USERNAME is required" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            image_tag="${DISPATCH_TAG}"
          fi

          if [[ -z "${image_tag}" || "${image_tag}" == */* ]]; then
            echo "Invalid image tag: ${image_tag}" >&2
            exit 1
          fi

          image="${REGISTRY}/${IMAGE_NAME}:${image_tag}"
          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${image}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.WUD_REGISTRY_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: |
            WUD_VERSION=${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
